'use strict';
const data=JSON.parse(document.getElementById('data').textContent);
let item=data.items[0],hue=null,group='all';const $=id=>document.getElementById(id);
const rgb=v=>[(v>>10&31),(v>>5&31),(v&31)].map(x=>Math.round(x*255/31));
const decoded=new Map();
function draw(canvas,i,h){let raw=decoded.get(i.id);if(!raw){const bytes=Uint8Array.from(atob(data.raws[i.id]),c=>c.charCodeAt(0)),v=new DataView(bytes.buffer),w=v.getUint16(4,true),height=v.getUint16(6,true),pixels=new Uint16Array(w*height);
 for(let y=0;y<height;y++){let p=8+height*2+v.getUint16(8+y*2,true)*2,x=0;while(p+4<=bytes.length){const skip=v.getUint16(p,true),run=v.getUint16(p+2,true);p+=4;if(!skip&&!run)break;x+=skip;if(x+run>w||p+run*2>bytes.length)throw Error('Neplatný obrázek');for(let n=0;n<run;n++){pixels[y*w+x++]=v.getUint16(p,true);p+=2;}}}raw={w,h:height,pixels};decoded.set(i.id,raw);}

}
function match(v,q){const idQuery=q.replace(/^hue\s+/,'');return v.name.toLowerCase().includes(q)||String(v.id)===idQuery||('0x'+v.id.toString(16))===idQuery;}
function show(){draw($('art'),item,hue);$('art').style.width=Math.min(item.w*2,220)+'px';$('art').setAttribute('aria-label',item.name+', '+(hue?'Hue '+hue.id:'původní barva'));$('itemName').textContent=item.name;$('hueName').textContent=hue?'Hue '+hue.id:'Původní barva';$('hueDescription').textContent=hue?.name||'';$('hueDescription').hidden=!hue;$('ids').textContent='ItemID '+item.id+' · Hue '+(hue?.id||0);for(const b of document.querySelectorAll('[data-item]'))b.setAttribute('aria-pressed',String(Number(b.dataset.item)===item.id));for(const b of document.querySelectorAll('[data-hue]'))b.setAttribute('aria-pressed',String(Number(b.dataset.hue)===hue?.id));}
function items(){const list=$('items');list.replaceChildren();for(const i of data.items.filter(i=>match(i,$('itemsQuery').value.trim().toLowerCase()))){const b=document.createElement('button');b.className='item';b.dataset.item=i.id;const c=document.createElement('canvas');draw(c,i,null);c.style.width=i.w+'px';c.style.height=i.h+'px';b.append(c);const name=document.createElement('span');name.textContent=i.name;b.append(name);const id=document.createElement('small');id.textContent=String(i.id);b.append(id);b.onclick=()=>{item=i;show();};list.append(b);}if(!list.children.length)list.textContent='Předmět není v povolené nabídce.';show();}
function colors(){const list=$('colors');list.replaceChildren();for(const h of data.hues.filter(h=>(group==='all'||h.group===group)&&match(h,$('query').value.trim().toLowerCase()))){const b=document.createElement('button');b.className='color';b.dataset.hue=h.id;const sw=document.createElement('span');sw.className='swatch';sw.style.background='linear-gradient(90deg,'+[6,12,18,24,31].map(n=>'rgb('+rgb(h.palette[n]).join(',')+')').join(',')+')';const name=document.createElement('span');name.className='hue-label';const title=document.createElement('strong');title.textContent='Hue '+h.id;const description=document.createElement('small');description.textContent=h.name;name.append(title,description);b.append(sw,name);b.onclick=()=>{hue=h;show();};list.append(b);}if(!list.children.length)list.textContent='Nebyla nalezena žádná povolená barva.';show();}
function categories(){const root=$('groups');root.replaceChildren();for(const g of data.groups){const count=g.id==='all'?data.hues.length:data.hues.filter(h=>h.group===g.id).length;const b=document.createElement('button');b.disabled=!count&&group!==g.id;b.setAttribute('aria-pressed',String(group===g.id));const dot=document.createElement('span');dot.className='groupdot';dot.style.background=g.color;const name=document.createElement('span');name.textContent=g.name+' '+count;b.append(dot,name);b.onclick=()=>{group=g.id;categories();colors();};root.append(b);}}
categories();$('title').textContent=data.title;document.title=data.title;$('query').oninput=colors;$('itemsQuery').oninput=items;$('reset').onclick=()=>{hue=null;show();};items();colors();
